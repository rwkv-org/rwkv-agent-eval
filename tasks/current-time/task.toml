schema_version = "1.4"

[task]
name = "rwkv-agent-eval/current-time"
description = "Look up the current time with a tool instead of guessing."

[metadata]
role = "sub"
difficulty = "easy"
source = "own"
category = "lookup"
answer = true               # graded from the agent's final message (see README)

[agent]
timeout_sec = 180

[verifier]
timeout_sec = 30
environment_mode = "shared"

[environment]
docker_image = "rae-eval-base:py312-slim"
memory_mb = 4096
